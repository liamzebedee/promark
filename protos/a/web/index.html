<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        h1 {
            color: #fff;
            font-weight: 400;
            font-size: 24px;
        }
        #canvas {
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            width: 900px;
            height: 700px;
        }
        .status {
            color: #666;
            font-size: 14px;
        }
        .status.loading {
            color: #f90;
        }
        .status.ready {
            color: #4a4;
        }
        .status.error {
            color: #f44;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MD Editor</h1>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
        <div id="status" class="status loading">Loading...</div>
    </div>

    <script>
        var Module = {
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            onRuntimeInitialized: function() {
                document.getElementById('status').textContent = 'Ready';
                document.getElementById('status').className = 'status ready';
                document.getElementById('canvas').focus();
            },
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            }
        };

        // API for interacting with the editor from JavaScript
        window.MDEditor = {
            setContent: function(text) {
                if (Module._setContent) {
                    var len = Module.lengthBytesUTF8(text) + 1;
                    var ptr = Module._malloc(len);
                    Module.stringToUTF8(text, ptr, len);
                    Module._setContent(ptr);
                    Module._free(ptr);
                }
            },
            getContent: function() {
                if (Module._getContent) {
                    return Module.UTF8ToString(Module._getContent());
                }
                return '';
            },
            isDirty: function() {
                return Module._isDirty ? Module._isDirty() : false;
            },
            markClean: function() {
                if (Module._markClean) Module._markClean();
            }
        };
    </script>
    <script async src="mdeditor.js"></script>
</body>
</html>
